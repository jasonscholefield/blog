<svg viewBox="0 0 700 440" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif">
  <rect x="0" y="0" width="700" height="440" rx="8" fill="#161616" stroke="#262626" stroke-width="1"/>

  <text x="32" y="40" fill="#f5f5f5" font-size="16" font-weight="600">Hunt: Showdown — Steam concurrent players by year</text>
  <text x="32" y="60" fill="#6e6e6e" font-size="12">Average vs. peak, 2018–2026 · source: steamcharts.com</text>

  <!-- legend -->
  <rect x="560" y="32" width="10" height="10" fill="#6e6e6e"/>
  <text x="576" y="41" fill="#a1a1a1" font-size="11">Average</text>
  <rect x="560" y="50" width="10" height="10" fill="#f5f5f5"/>
  <text x="576" y="59" fill="#a1a1a1" font-size="11">Peak</text>

  <!-- gridlines -->
  <g stroke="#262626" stroke-width="1">
    <line x1="60" y1="340" x2="660" y2="340"/>
    <line x1="60" y1="280" x2="660" y2="280"/>
    <line x1="60" y1="220" x2="660" y2="220"/>
    <line x1="60" y1="160" x2="660" y2="160"/>
    <line x1="60" y1="100" x2="660" y2="100"/>
  </g>
  <g fill="#6e6e6e" font-size="11" text-anchor="end">
    <text x="52" y="344">0</text>
    <text x="52" y="284">15k</text>
    <text x="52" y="224">30k</text>
    <text x="52" y="164">45k</text>
    <text x="52" y="104">60k</text>
  </g>

  <!-- average bars -->
  <g fill="#6e6e6e">
    <rect x="75" y="333.4" width="16" height="6.6" rx="1.5"/>
    <rect x="142" y="328.88" width="16" height="11.12" rx="1.5"/>
    <rect x="209" y="317.0" width="16" height="23.0" rx="1.5"/>
    <rect x="275" y="295.2" width="16" height="44.8" rx="1.5"/>
    <rect x="342" y="283.76" width="16" height="56.24" rx="1.5"/>
    <rect x="409" y="270.76" width="16" height="69.24" rx="1.5"/>
    <rect x="475" y="279.72" width="16" height="60.28" rx="1.5"/>
    <rect x="542" y="286.4" width="16" height="53.6" rx="1.5"/>
    <rect x="609" y="274.8" width="16" height="65.2" rx="1.5" fill-opacity="0.7"/>
  </g>

  <!-- peak bars -->
  <g fill="#f5f5f5">
    <rect x="95" y="284.0" width="16" height="56.0" rx="1.5"/>
    <rect x="162" y="286.1" width="16" height="53.9" rx="1.5"/>
    <rect x="229" y="273.9" width="16" height="66.1" rx="1.5"/>
    <rect x="295" y="203.0" width="16" height="137.0" rx="1.5"/>
    <rect x="362" y="186.9" width="16" height="153.1" rx="1.5"/>
    <rect x="429" y="161.9" width="16" height="178.1" rx="1.5"/>
    <rect x="495" y="100.1" width="16" height="239.9" rx="1.5" stroke="#343434" stroke-width="1.5"/>
    <rect x="562" y="177.3" width="16" height="162.7" rx="1.5"/>
    <rect x="629" y="166.5" width="16" height="173.5" rx="1.5"/>
  </g>

  <!-- average value labels -->
  <g fill="#a1a1a1" font-size="10.5" text-anchor="middle">
    <text x="83" y="327">1.7k</text>
    <text x="150" y="322">2.8k</text>
    <text x="217" y="311">5.7k</text>
    <text x="283" y="289">11.2k</text>
    <text x="350" y="278">14.1k</text>
    <text x="417" y="265">17.3k</text>
    <text x="483" y="274">15.1k</text>
    <text x="550" y="280">13.4k</text>
    <text x="617" y="269">16.3k*</text>
  </g>

  <!-- peak value labels -->
  <g fill="#a1a1a1" font-size="10.5" text-anchor="middle">
    <text x="103" y="278">14.0k</text>
    <text x="170" y="280">13.5k</text>
    <text x="237" y="268">16.5k</text>
    <text x="303" y="197">34.2k</text>
    <text x="370" y="181">38.3k</text>
    <text x="437" y="156">44.5k</text>
    <text x="570" y="171">40.7k</text>
    <text x="637" y="160">43.4k*</text>
  </g>
  <text x="493" y="88" fill="#f5f5f5" font-size="11" font-weight="600" text-anchor="middle">59,968 · Aug 2024</text>

  <!-- year labels -->
  <g fill="#6e6e6e" font-size="12" text-anchor="middle">
    <text x="93" y="360">2018</text>
    <text x="160" y="360">2019</text>
    <text x="227" y="360">2020</text>
    <text x="293" y="360">2021</text>
    <text x="360" y="360">2022</text>
    <text x="427" y="360">2023</text>
    <text x="493" y="360">2024</text>
    <text x="560" y="360">2025</text>
    <text x="627" y="360">2026</text>
  </g>

  <text x="32" y="416" fill="#6e6e6e" font-size="11">*2026 figures are partial year (through August)</text>
</svg>
